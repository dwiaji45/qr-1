<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QR Dua Dimensi</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="icon" type="image/x-icon" href="https://lh3.googleusercontent.com/d/196-yYlDwDc-tUVDTslzPAlBWTmf4ZbWg">
    <script src="https://cdn.jsdelivr.net/npm/qrcode/build/qrcode.min.js"></script>
    
    <style>
        /* CSS Reset & Dasar */
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { 
            font-family: 'Inter', sans-serif; 
            background-color: #f3f6f9; 
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
            color: #333;
        }

        /* Desain Card Utama */
        .card { 
            background: #ffffff; 
            padding: 40px 32px; 
            border-radius: 16px; 
            box-shadow: 0 10px 30px rgba(14, 88, 166, 0.08); 
            width: 100%;
            max-width: 420px;
            text-align: center;
        }
        
        .card h2 {
            font-weight: 600;
            font-size: 22px;
            margin-bottom: 24px;
            color: #111;
        }

        /* Desain Input & Baris Input */
        .input-group { 
            margin-bottom: 16px; 
            text-align: left;
        }
        .input-group label {
            display: block;
            font-weight: 500;
            font-size: 13px;
            color: #555;
            margin-bottom: 8px;
        }
        
        /* Modifikasi Layout Input untuk Fitur Shortlink & Copy */
        .input-row {
            display: flex;
            gap: 8px;
        }
        .input-row input[type="text"] {
            flex: 1; /* Input mengisi sisa ruang */
        }

        input[type="text"] { 
            width: 100%; 
            padding: 12px 16px; 
            font-family: 'Inter', sans-serif;
            font-size: 14px;
            border: 1px solid #e2e8f0; 
            border-radius: 8px; 
            transition: all 0.3s ease;
            outline: none;
            background-color: #fafbfc;
        }
        input[type="text"]:focus {
            border-color: #0e58a6;
            background-color: #fff;
            box-shadow: 0 0 0 3px rgba(14, 88, 166, 0.15);
        }

        /* Desain Tombol Ikon (Copy & Shorten) */
        .icon-btn {
            background-color: #fafbfc;
            border: 1px solid #e2e8f0;
            border-radius: 8px;
            padding: 0 14px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.3s ease;
        }
        .icon-btn:hover {
            background-color: #e2e8f0;
            border-color: #cbd5e1;
        }
        .icon-btn:active {
            transform: scale(0.95);
        }
        .icon-btn svg {
            width: 18px;
            height: 18px;
            fill: #475569;
        }
        
        /* Tombol Buat QR */
        #btn-buat { 
            background-color: #0e58a6;
            color: #ffffff; 
            padding: 14px; 
            border: none; 
            border-radius: 8px; 
            cursor: pointer; 
            font-size: 15px; 
            font-weight: 600;
            font-family: 'Inter', sans-serif;
            width: 100%;
            margin-top: 8px;
            transition: all 0.3s ease;
        }
        #btn-buat:hover { 
            background-color: #0a427c; 
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(14, 88, 166, 0.2);
        }

        /* Wadah Hasil Canvas */
        #canvas-container { 
            margin-top: 24px; 
            padding: 16px; 
            background: #f8fafc; 
            border-radius: 12px;
            border: 1px dashed #cbd5e1;
            display: none; 
            animation: fadeIn 0.5s ease-in-out;
        }
        canvas { 
            max-width: 100%; 
            height: auto;
            border-radius: 8px;
        }

        /* Grup Tombol Unduh */
        .btn-group {
            display: none;
            gap: 12px;
            margin-top: 16px;
            animation: fadeIn 0.5s ease-in-out;
        }

        /* Tombol Unduh (Gaya Outline) */
        .btn-outline {
            flex: 1; 
            background-color: transparent; 
            color: #0e58a6; 
            padding: 12px; 
            border: 2px solid #0e58a6; 
            border-radius: 8px; 
            cursor: pointer; 
            font-size: 14px; 
            font-weight: 600;
            font-family: 'Inter', sans-serif;
            transition: all 0.3s ease;
        }
        .btn-outline:hover { 
            background-color: #0e58a6; 
            color: #ffffff;
        }

        /* Animasi Muncul */
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>

    <div class="card">
        <h2>Buat QR Code</h2>
        
        <div class="input-group">
            <label>Teks atau URL Tujuan</label>
            <div class="input-row">
                <input type="text" id="input-teks" placeholder="Masukkan link atau teks...">
                
                <button class="icon-btn" id="btn-shorten" onclick="shortenUrl()" title="Perpendek URL">
                    <svg viewBox="0 0 24 24">
                        <path d="M3.9 12c0-1.71 1.39-3.1 3.1-3.1h4V7H7c-2.76 0-5 2.24-5 5s2.24 5 5 5h4v-1.9H7c-1.71 0-3.1-1.39-3.1-3.1zM8 13h8v-2H8v2zm9-6h-4v1.9h4c1.71 0 3.1 1.39 3.1 3.1s-1.39 3.1-3.1 3.1h-4V17h4c2.76 0 5-2.24 5-5s-2.24-5-5-5z"/>
                    </svg>
                </button>
                
                <button class="icon-btn" onclick="copyText()" title="Salin Teks/URL">
                    <svg viewBox="0 0 24 24">
                        <path d="M16 1H4c-1.1 0-2 .9-2 2v14h2V3h12V1zm3 4H8c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h11c1.1 0 2-.9 2-2V7c0-1.1-.9-2-2-2zm0 16H8V7h11v14z"/>
                    </svg>
                </button>
            </div>
        </div>
        
        <div class="input-group">
            <label>Judul File & QR Code</label>
            <input type="text" id="input-judul" placeholder="Contoh: Website Perusahaan">
        </div>
        
        <button id="btn-buat" onclick="buatQR()">Generate QR Code</button>
        
        <div id="canvas-container">
            <canvas id="qr-canvas" width="400" height="450"></canvas>
        </div>

        <div class="btn-group" id="grup-unduh">
            <button class="btn-outline" onclick="unduhGambar('png')">Unduh PNG</button>
            <button class="btn-outline" onclick="unduhGambar('svg')">Unduh SVG</button>
        </div>
    </div>

    <script>
        const logoUrl = "https://lh3.googleusercontent.com/d/196-yYlDwDc-tUVDTslzPAlBWTmf4ZbWg";
        let currentQrSvgData = ""; 
        let currentLogoBase64 = "";

        // --- FITUR BARU: Short Link ---
        async function shortenUrl() {
            const inputTeks = document.getElementById("input-teks");
            const url = inputTeks.value.trim();

            if (!url) {
                alert("Mohon masukkan URL terlebih dahulu.");
                return;
            }

            // Validasi apakah input adalah URL yang valid untuk diperpendek
            if (!url.startsWith("http://") && !url.startsWith("https://")) {
                alert("Harap masukkan URL yang valid (dimulai dengan http:// atau https://). Teks biasa tidak dapat diperpendek.");
                return;
            }

            const btnShorten = document.getElementById("btn-shorten");
            btnShorten.disabled = true;
            btnShorten.style.opacity = "0.5";

            try {
                // Menggunakan TinyURL API (gratis & tidak memerlukan CORS khusus)
                const response = await fetch(`https://tinyurl.com/api-create.php?url=${encodeURIComponent(url)}`);
                
                if (response.ok) {
                    const shortUrl = await response.text();
                    inputTeks.value = shortUrl;
                    alert("URL berhasil diperpendek!");
                } else {
                    alert("Gagal memperpendek URL. Layanan mungkin sedang sibuk.");
                }
            } catch (error) {
                console.error("Error shortening URL:", error);
                alert("Terjadi kesalahan jaringan saat mencoba memperpendek URL.");
            } finally {
                btnShorten.disabled = false;
                btnShorten.style.opacity = "1";
            }
        }

        // --- FITUR BARU: Copy Teks ---
        function copyText() {
            const inputTeks = document.getElementById("input-teks");
            
            if (!inputTeks.value.trim()) {
                alert("Tidak ada teks yang dapat disalin.");
                return;
            }

            // Salin ke clipboard sistem
            navigator.clipboard.writeText(inputTeks.value).then(() => {
                alert("Teks berhasil disalin ke clipboard!");
            }).catch(err => {
                console.error("Gagal menyalin: ", err);
                alert("Gagal menyalin teks secara otomatis.");
            });
        }

        // --- FUNGSI BAWAAN: Generate QR ---
        // --- FUNGSI BAWAAN: Generate QR ---
        function buatQR() {
            const teks = document.getElementById("input-teks").value;
            const judul = document.getElementById("input-judul").value;
    
            if (!teks) {
                alert("Mohon masukkan Teks atau URL tujuan terlebih dahulu.");
                return;
            }

            const canvas = document.getElementById("qr-canvas");
            const ctx = canvas.getContext("2d");

    // --- FIX 1: Resolusi High-DPI untuk ketajaman ekstra ---
            const dpr = window.devicePixelRatio || 1;
            const rectWidth = 400;
            const rectHeight = 450;

    // Atur resolusi internal canvas dikalikan dengan rasio layar
            canvas.width = rectWidth * dpr;
            canvas.height = rectHeight * dpr;
    
    // Atur ukuran visual canvas menggunakan CSS
            canvas.style.width = `${rectWidth}px`;
            canvas.style.height = `${rectHeight}px`;

    // Skalakan context agar semua elemen yang digambar proporsional
            ctx.scale(dpr, dpr);

    // --- FIX 2: Tingkatkan Kualitas Smoothing Gambar ---
            ctx.imageSmoothingEnabled = true;
            ctx.imageSmoothingQuality = "high";

            ctx.fillStyle = "#ffffff";
            ctx.fillRect(0, 0, rectWidth, rectHeight);

            ctx.fillStyle = "#111111";
            ctx.font = "bold 22px 'Inter', Arial, sans-serif";
            ctx.textAlign = "center";
            let teksJudul = judul.trim() === "" ? "QR Code" : judul;
            ctx.fillText(teksJudul, rectWidth / 2, 45); 

            const tempCanvas = document.createElement("canvas");
    
            QRCode.toCanvas(tempCanvas, teks, {
                width: 360,
                margin: 1,
                color: { dark: "#000000", light: "#ffffff" },
                errorCorrectionLevel: 'H' 
            }, function (error) {
                if (error) console.error(error);
                ctx.drawImage(tempCanvas, 20, 65, 360, 360);

                QRCode.toString(teks, {
            type: 'svg',
            margin: 1,
            color: { dark: "#000000", light: "#ffffff" },
            errorCorrectionLevel: 'H'
                }, function (err, svgString) {
            if (err) console.error(err);
            
            const parser = new DOMParser();
            const doc = parser.parseFromString(svgString, "image/svg+xml");
            const svgEl = doc.documentElement;
            svgEl.setAttribute("width", "360");
            svgEl.setAttribute("height", "360");
            svgEl.setAttribute("x", "20");
            svgEl.setAttribute("y", "65");
                    currentQrSvgData = svgEl.outerHTML;

                    const img = new Image();
                    img.crossOrigin = "Anonymous"; 
                    img.src = logoUrl;
            
                    img.onload = function() {
                        const imgCanvas = document.createElement("canvas");
                        imgCanvas.width = img.width;
                        imgCanvas.height = img.height;
                        imgCanvas.getContext("2d").drawImage(img, 0, 0);
                        currentLogoBase64 = imgCanvas.toDataURL("image/png");

                        const logoSize = 80; 
                        const x = 20 + (360 / 2) - (logoSize / 2);
                        const y = 65 + (360 / 2) - (logoSize / 2);

                        ctx.fillStyle = "#ffffff";
                        ctx.beginPath();
                        ctx.arc(x + logoSize/2, y + logoSize/2, (logoSize/2) + 6, 0, 2 * Math.PI);
                        ctx.fill();
        
                        ctx.save();
                        ctx.beginPath();
                        ctx.arc(x + logoSize/2, y + logoSize/2, logoSize/2, 0, Math.PI * 2, true);
                        ctx.closePath();
                        ctx.clip();
                
                // Pastikan smoothing menyala kembali di dalam area clipping
                        ctx.imageSmoothingEnabled = true;
                        ctx.imageSmoothingQuality = "high";
                
                        ctx.drawImage(img, x, y, logoSize, logoSize);
                        ctx.restore();

                        document.getElementById("canvas-container").style.display = "block";
                                document.getElementById("grup-unduh").style.display = "flex";
                    };
                });
            });
        }

        // --- FUNGSI BAWAAN: Unduh ---
        function unduhGambar(format) {
            const judulInput = document.getElementById("input-judul").value.trim();
            let namaFile = judulInput === "" ? "QR_Code" : judulInput;
            namaFile = namaFile.replace(/\s+/g, '_'); 

            const link = document.createElement("a");

            if (format === 'png') {
                const canvas = document.getElementById("qr-canvas");
                link.download = namaFile + ".png";
                link.href = canvas.toDataURL("image/png");
            } 
            else if (format === 'svg') {
                let judulTeks = judulInput === "" ? "QR Code" : judulInput;
                
                const svgLengkap = `
                    <svg xmlns="http://www.w3.org/2000/svg" width="400" height="450">
                        <rect width="400" height="450" fill="#ffffff" />
                        <text x="200" y="45" font-family="'Inter', Arial, sans-serif" font-size="22" font-weight="bold" text-anchor="middle" fill="#111111">${judulTeks}</text>
                        
                        ${currentQrSvgData}
                        
                        <circle cx="200" cy="245" r="46" fill="#ffffff" />
                        <clipPath id="logo-clip">
                            <circle cx="200" cy="245" r="40" />
                        </clipPath>
                        <image href="${currentLogoBase64}" x="160" y="205" width="80" height="80" clip-path="url(#logo-clip)" preserveAspectRatio="xMidYMid slice" />
                    </svg>
                `;

                const blob = new Blob([svgLengkap], { type: "image/svg+xml;charset=utf-8" });
                link.download = namaFile + ".svg";
                link.href = URL.createObjectURL(blob);
            }

            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
        }
    </script>
</body>
</html>
